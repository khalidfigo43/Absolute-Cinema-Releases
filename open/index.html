<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Absolute Cinema</title>
<style>
  :root { --bg:#0b0b10; --card:#16161d; --fg:#f5f5f7; --mut:#a1a1aa; --acc:#e50914; }
  @media (prefers-color-scheme: light) { :root { --bg:#f4f4f5; --card:#fff; --fg:#111; --mut:#5f5f66; --acc:#d10812; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font-family: system-ui, "Segoe UI", Tahoma, sans-serif; padding:24px 16px; }
  main { width:100%; max-width:380px; background:var(--card); border-radius:20px; padding:24px; text-align:center;
         box-shadow:0 10px 30px rgba(0,0,0,.25); }
  img.poster { width:140px; aspect-ratio:2/3; object-fit:cover; border-radius:12px; background:#333; }
  h1 { font-size:1.15rem; margin:16px 0 4px; }
  p { color:var(--mut); line-height:1.7; margin:6px 0 18px; font-size:.95rem; }
  a.btn, button.btn { display:block; width:100%; padding:14px; border-radius:12px; border:0; font-size:1rem;
         font-weight:700; text-decoration:none; cursor:pointer; margin-top:10px; font-family:inherit; }
  .primary { background:var(--acc); color:#fff; }
  .secondary { background:transparent; color:var(--fg); border:1px solid var(--mut) !important; }
  small { display:block; color:var(--mut); margin-top:14px; line-height:1.6; }
  .brand { font-weight:800; letter-spacing:.02em; direction:ltr; }
  .brand b { color:var(--acc); }
</style>
</head>
<body>
<main>
  <div class="brand">Absolute <b>Cinema</b></div>
  <img class="poster" id="poster" alt="" hidden>
  <h1 id="title">صفحة متشاركة</h1>
  <p id="hint">لو التطبيق متسطّب هيفتح على الصفحة دي على طول.</p>
  <a class="btn primary" id="open" href="#">افتح في التطبيق</a>
  <button class="btn secondary" id="get" type="button">حمّل التطبيق</button>
  <small id="after" hidden>بعد ما تسطّب التطبيق افتحه، وهيفتح على نفس الصفحة لوحده.</small>
</main>
<script>
(function () {
  var PKG = 'com.moviedownloader.movie_downloader';
  var params = new URLSearchParams(location.search);
  var d = (params.get('d') || '').replace(/[^A-Za-z0-9_-]/g, '');
  var appLink = 'absolutecinema://app/open?d=' + d;
  var here = location.origin + location.pathname + '?d=' + d;

  // Title and poster from the link (shown as text only).
  try {
    var b64 = d.replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    var bytes = Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); });
    var data = JSON.parse(new TextDecoder().decode(bytes));
    if (data.t) document.getElementById('title').textContent = data.t;
    if (data.p && /^https:\/\//.test(data.p)) {
      var img = document.getElementById('poster');
      img.src = data.p; img.hidden = false;
      img.onerror = function () { img.hidden = true; };
    }
  } catch (e) {}

  var intent = 'intent://app/open?d=' + d + '#Intent;scheme=absolutecinema;package=' + PKG +
               ';S.browser_fallback_url=' + encodeURIComponent(here + '&noapp=1') + ';end';
  document.getElementById('open').href = d ? intent : '#';

  // Try the app once on arrival; without it Chrome comes back with noapp=1.
  if (d && !params.has('noapp') && /Android/i.test(navigator.userAgent)) {
    location.href = intent;
  }
  if (params.has('noapp')) {
    document.getElementById('hint').textContent = 'التطبيق مش متسطّب عندك. حمّله وافتحه، وهيفتح على الصفحة دي.';
  }

  document.getElementById('get').addEventListener('click', function () {
    // The app reads this once on its first start and opens the same page.
    var copy = d && navigator.clipboard ? navigator.clipboard.writeText(appLink).catch(function () {}) : Promise.resolve();
    copy.then(function () { return fetch('../latest.json', { cache: 'no-store' }); })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        document.getElementById('after').hidden = false;
        if (j && j.apkUrl) location.href = j.apkUrl;
      })
      .catch(function () {
        location.href = 'https://github.com/khalidfigo43/Absolute-Cinema-Releases/tree/main/apk';
      });
  });
})();
</script>
</body>
</html>
